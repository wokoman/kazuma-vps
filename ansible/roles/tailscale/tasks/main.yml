---
- name: Ensure directory for keyrings exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Tailscale signing key
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.lsb.codename | default('noble') }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale apt repository
  copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_facts.lsb.codename | default('noble') }} main\n"
    mode: '0644'

- name: Install Tailscale
  apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is enabled and running
  systemd:
    name: tailscaled
    state: started
    enabled: true

# The NAS initiates the backup pull, so tailnet peers must reach sshd; UFW's
# default-deny drops them otherwise. Which peers may connect is decided by
# tailnet ACLs, not by this rule.
- name: Allow tailnet traffic through UFW
  ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Check whether the host has joined the tailnet
  command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Join the tailnet
  command: >-
    tailscale up
    --authkey {{ tailscale_auth_key }}
    --advertise-tags {{ tailscale_tags }}
  when: >-
    tailscale_status.rc != 0
    or (tailscale_status.stdout | from_json).BackendState != 'Running'
  no_log: true
