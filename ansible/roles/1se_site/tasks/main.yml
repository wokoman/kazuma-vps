---
- name: Create 1SE site destination directory
  file:
    path: "{{ ose_site_dest }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy 1SE index.html
  copy:
    src: "{{ playbook_dir }}/../../static-sites/1se/index.html"
    dest: "{{ ose_site_dest }}/index.html"
    owner: root
    group: root
    mode: '0644'

# Served by Caddy's handle_errors when the NAS holding the videos is offline.
- name: Deploy 1SE outage page
  copy:
    src: "{{ playbook_dir }}/../../static-sites/1se/unavailable.html"
    dest: "{{ ose_site_dest }}/unavailable.html"
    owner: root
    group: root
    mode: '0644'
