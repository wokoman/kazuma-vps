---
- name: Ensure directory for keyrings exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Caddy GPG key
  get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy.gpg.key
    mode: '0644'

- name: De-armor Caddy GPG key
  command: >-
    gpg --dearmor --yes --output /usr/share/keyrings/caddy-stable-archive-keyring.gpg /tmp/caddy.gpg.key
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy apt repository
  copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    content: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/ubuntu {{ ansible_facts.lsb.codename | default('noble') }} main\n"
    mode: '0644'

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: false

- name: Ensure the Caddy unit drop-in directory exists
  file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Confine Caddy with systemd sandboxing
  copy:
    dest: /etc/systemd/system/caddy.service.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (role: caddy)
      [Service]
      # ProtectSystem stays at the packaged full: strict would hide
      # /var/lib/caddy, and losing the cert store takes every site offline at
      # the next renewal rather than visibly at restart.
      NoNewPrivileges=true
      # The packaged unit grants these two ambiently but leaves the bounding
      # set wide, so a subprocess could still pick up anything else.
      CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
      PrivateDevices=true
      ProtectHome=true
      ProtectProc=invisible
      ProtectClock=true
      ProtectHostname=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectKernelLogs=true
      ProtectControlGroups=true
      RestrictNamespaces=true
      RestrictRealtime=true
      RestrictSUIDSGID=true
      # AF_NETLINK because Go enumerates interfaces through it.
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
      LockPersonality=true
      MemoryDenyWriteExecute=true
      RemoveIPC=true
      SystemCallArchitectures=native
      SystemCallFilter=@system-service
      UMask=0077
  notify: Restart Caddy

- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
    # A broken Caddyfile would otherwise only surface as a failed restart,
    # by which point every site on the box is down.
    validate: caddy validate --adapter caddyfile --config %s
  notify: Restart Caddy

- name: Ensure Caddy is enabled and running
  systemd:
    name: caddy
    state: started
    enabled: true
