---
# Security Hardening Tasks
# This role configures SSH hardening, fail2ban, and firewall rules

- name: Deploy hardened SSH configuration
  template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'
    # A rejected directive would otherwise only surface when sshd refuses to
    # come back, by which point the box is unreachable.
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh socket

- name: Remove the superseded SSH drop-in
  file:
    path: /etc/ssh/sshd_config.d/10-custom-port.conf
    state: absent
  notify: restart ssh socket

# The provider seeds root with the operator's own key. PermitRootLogin and
# AllowUsers both refuse it, so it only widens the blast radius of a leak.
- name: Drop the bootstrap key from root
  file:
    path: /root/.ssh/authorized_keys
    state: absent

- name: Allow custom SSH port through UFW
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: ssh_port is defined

- name: Remove legacy OpenSSH UFW rule (port 22)
  ufw:
    rule: allow
    name: OpenSSH
    delete: yes
  ignore_errors: yes

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Create fail2ban jail.local configuration
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      # The tailnet is the only route that still works once the public IP is
      # banned, and a failed backup pull must never lock the NAS out.
      ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10

      bantime = 1h
      findtime = 10m
      maxretry = 5

      # Repeat offenders double each time rather than getting a fresh hour.
      # Capped, because a home IP that mistypes its way to a ban has to be able
      # to wait it out.
      bantime.increment = true
      bantime.maxtime = 1w
      # One scanner usually works through sshd and the web apps in turn.
      bantime.overalljails = true

      [sshd]
      enabled = true
      port = {{ ssh_port | default(22) }}
      backend = systemd
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

# bantime.increment reads ban history from the database, so history that is
# purged before bantime.maxtime silently resets the escalation.
- name: Keep ban history longer than the longest ban
  copy:
    dest: /etc/fail2ban/fail2ban.d/10-dbpurgeage.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (role: security_hardening)
      [Definition]
      dbpurgeage = 2w
  notify: restart fail2ban

- name: Ensure fail2ban is enabled and started
  systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Display security status
  debug:
    msg:
      - "Security hardening applied:"
      - "  - SSH port: {{ ssh_port | default(22) }}"
      - "  - Root login: disabled"
      - "  - Password auth: disabled"
      - "  - Fail2ban: enabled"
      - "  - UFW: active with ports {{ ssh_port | default(22) }}, 80, 443"