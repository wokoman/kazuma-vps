---
# Security Hardening Tasks
# This role configures SSH hardening, fail2ban, and firewall rules

- name: Deploy hardened SSH configuration
  template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'
    # A rejected directive would otherwise only surface when sshd refuses to
    # come back, by which point the box is unreachable.
    validate: /usr/sbin/sshd -t -f %s
  notify: reload ssh

- name: Remove the superseded SSH drop-in
  file:
    path: /etc/ssh/sshd_config.d/10-custom-port.conf
    state: absent
  notify: reload ssh

- name: Allow custom SSH port through UFW
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: ssh_port is defined

- name: Remove legacy OpenSSH UFW rule (port 22)
  ufw:
    rule: allow
    name: OpenSSH
    delete: yes
  ignore_errors: yes

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Create fail2ban jail.local configuration
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5
      
      [sshd]
      enabled = true
      port = {{ ssh_port | default(22) }}
      backend = systemd
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Ensure fail2ban is enabled and started
  systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Display security status
  debug:
    msg:
      - "Security hardening applied:"
      - "  - SSH port: {{ ssh_port | default(22) }}"
      - "  - Root login: disabled"
      - "  - Password auth: disabled"
      - "  - Fail2ban: enabled"
      - "  - UFW: active with ports {{ ssh_port | default(22) }}, 80, 443"