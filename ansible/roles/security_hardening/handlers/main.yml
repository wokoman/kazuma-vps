---
# Handlers for security_hardening role

# The generator rebuilds ssh.socket's listener from sshd_config only on
# daemon-reload, so without this a port change never reaches the listener.
- name: restart ssh socket
  systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true

- name: restart fail2ban
  systemd:
    name: fail2ban
    state: restarted