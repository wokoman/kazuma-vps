---
# The provider's own accounts (root, ubuntu) exist outside this repo and are
# re-seeded on a rebuild, so naming who may log in is what governs them.
# ssh_interactive_users lives in SOPS: no role creates those accounts, and the
# repo is public.
ssh_allowed_users: >-
  {{ ([provision_user_name] + ssh_interactive_users.split()
      + ([backup_pull_user] if backup_enabled | bool else [])) | join(' ') }}
