---
- name: Install Postgres packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: true

- name: Ensure Postgres is running
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Install python3-psycopg2 for PostgreSQL modules
  apt:
    name: python3-psycopg2
    state: present

- name: Create Miniflux database user
  become: true
  become_user: postgres
  postgresql_user:
    name: "{{ miniflux_db_user }}"
    password: "{{ miniflux_db_password }}"
    state: present

- name: Create Miniflux database
  become: true
  become_user: postgres
  postgresql_db:
    name: "{{ miniflux_db_name }}"
    owner: "{{ miniflux_db_user }}"
    state: present

- name: Add Miniflux apt repository
  copy:
    dest: /etc/apt/sources.list.d/miniflux.list
    content: "deb [trusted=yes] https://repo.miniflux.app/apt/ * *\n"
    mode: '0644'

# Written before the package: the upstream unit declares it as EnvironmentFile,
# and systemd refuses to start the service if it is missing at post-install.
- name: Write Miniflux configuration file
  copy:
    dest: /etc/miniflux.conf
    owner: root
    group: root
    mode: '0640'
    content: |
      DATABASE_URL=postgres://{{ miniflux_db_user }}:{{ miniflux_db_password }}@127.0.0.1/{{ miniflux_db_name }}?sslmode=disable
      RUN_MIGRATIONS=1
      CREATE_ADMIN=1
      ADMIN_USERNAME={{ miniflux_admin_username }}
      ADMIN_PASSWORD={{ miniflux_admin_password }}
      LISTEN_ADDR=127.0.0.1:{{ miniflux_listen_port }}
      BASE_URL=https://{{ miniflux_domain }}
  notify: Restart Miniflux

- name: Install Miniflux
  apt:
    name: "miniflux={{ miniflux_version }}"
    state: present
    update_cache: true
    allow_change_held_packages: true

# Without this, a routine `apt upgrade` on the host would bump Miniflux and
# migrate the database as a side effect.
- name: Hold Miniflux at the pinned version
  dpkg_selections:
    name: miniflux
    selection: hold

- name: Remove legacy systemd override
  file:
    path: /etc/systemd/system/miniflux.service.d/override.conf
    state: absent
  notify: Restart Miniflux

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Ensure Miniflux is enabled and running
  systemd:
    name: miniflux
    state: started
    enabled: true