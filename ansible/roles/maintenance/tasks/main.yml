---
- name: Ensure journald drop-in directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journal size
  copy:
    dest: /etc/systemd/journald.conf.d/00-size.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: maintenance)
      [Journal]
      SystemMaxUse={{ journald_max_use }}
      MaxFileSec={{ journald_max_file_sec }}
  notify: Restart journald

- name: Keep apt tidy between runs
  copy:
    dest: /etc/apt/apt.conf.d/99-maintenance
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (role: maintenance)
      APT::Periodic::AutocleanInterval "{{ apt_periodic_autoclean_days }}";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

# There is no firmware to update on a VM, so these only ever fail, and a noisy
# `systemctl --failed` hides the failures that matter.
- name: Mask fwupd
  systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
    enabled: false
  loop:
    - fwupd.service
    - fwupd-refresh.service
    - fwupd-refresh.timer

- name: Report disk usage
  command: df -h --output=pcent,avail /
  register: maintenance_disk
  changed_when: false
  # Read-only, so --check should still show the real figure.
  check_mode: false

- name: Show disk usage
  debug:
    msg: "root filesystem: {{ maintenance_disk.stdout_lines[1] | trim }} available"

# unattended-upgrades stages kernel updates but never applies them without a
# reboot, and this box has no livepatch. Without this the vulnerable kernel
# keeps running indefinitely.
- name: Reboot automatically when an update requires it
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

# The provider image runs /usr/bin/resizelvm at every boot. It is not
# executable, and it targets /dev/mapper/vg-lv_root while this host's volume
# group is "lv" with no free extents, so it fails cloud-init.service forever
# while being incapable of doing anything useful.
- name: Drop the provider's dead disk-grow bootcmd
  replace:
    path: /etc/cloud/cloud.cfg
    regexp: '(?m)^bootcmd:\n- \[ /usr/bin/resizelvm \]$'
    replace: '# bootcmd dropped by Ansible: resizelvm targets a volume group this host does not have.'
