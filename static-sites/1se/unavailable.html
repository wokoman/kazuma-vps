<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videa jsou dočasně nedostupná</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            box-sizing: border-box;
            background: #111;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        p { margin: 0.4rem 0; }
        .lang { max-width: 30rem; }
        .muted { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="lang">
        <p>Videa jsou dočasně nedostupná.</p>
        <p class="muted">Úložiště s videi je právě offline. Zkuste to prosím za chvíli.</p>
    </div>
    <div class="lang" lang="en">
        <p>The videos are temporarily unavailable.</p>
        <p class="muted">The storage holding them is offline right now. Please try again shortly.</p>
    </div>
</body>
</html>
